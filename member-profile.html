<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments | Muscle Monk Gymnasium</title>
    <link rel="stylesheet" href="member.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="admin-layout">

        <aside class="sidebar">
            <div class="sidebar-logo">Muscle Monk</div>
            <ul class="sidebar-links">
                <li><a href="member-dashboard.html"><i class='bx bx-grid-alt'></i> Dashboard</a></li>
                <li><a href="member-membership.html"><i class='bx bx-id-card'></i> Membership</a></li>
                <li><a href="member-workout.html"><i class='bx bx-dumbbell'></i> Workout Planner</a></li>
                <li><a href="member-payments.html"><i class='bx bx-credit-card'></i> Payments</a></li>
                <li class="active"><a href="member-profile.html"><i class='bx bx-user'></i> Profile</a></li>
                <li><a href="member-settings.html"><i class='bx bx-cog'></i> Settings</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h1>Payments</h1>
                <div class="admin-profile">
                    <div class="avatar">AS</div>
                    <div class="profile-text">
                        <p class="profile-name">Aarav S.</p>
                        <p class="profile-role">Member</p>
                    </div>
                </div>
            </header>

     <div class="profile-wrapper">
      <div class="profile-card">
        <div class="profile-avatar">
            AS
        </div>
        <h2>Aarav Sharma</h2>

        <p class="profile-phone">
            +91 98200 11111
        </p>
        <span class="member-badge">
            Pro Member
        </span>

        <hr>
        <div class="profile-details">
            <div class="detail-item">
                <div class="detail-icon">
                    <i class='bx bx-user'></i>
                </div>
                <div class="detail-text">
                    <span>Gender</span>
                    <strong>Male</strong>
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-icon">
                    <i class='bx bx-calendar'></i>
                </div>
                <div class="detail-text">
                    <span>Joined</span>
                    <strong>2025-11-02</strong>
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-icon">
                    <i class='bx bx-heart'></i>
                </div>
                <div class="detail-text">
                    <span>Status</span>
                    <strong>Active</strong>
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-icon">
                    <i class='bx bx-phone'></i>
                </div>
                <div class="detail-text">
                    <span>Emergency</span>
                    <strong>+91 98200 99999</strong>
                </div>
            </div>
        </div>
    </div>

    <div class="profile-form-card">
        <div class="card-header">
            <h2>Personal Information</h2>
            <p>
                Update your details anytime.
            </p>
        </div>

        <div class="profile-form">
                        <div class="input-group">
                <div class="input-box">
                    <label>Full name</label>
                    <input
                        type="text"
                        value="Aarav Sharma">
                </div>

                <div class="input-box">
                    <label>Mobile</label>
                    <input
                        type="tel"
                        value="+91 98200 11111">
                </div>

                <div class="input-box">
                    <label>Emergency contact</label>
                    <input
                        type="tel"
                        value="+91 98200 99999">
                </div>

                <div class="input-box">
                    <label>Joining date</label>
                    <input
                        type="date"
                        value="2025-11-02">
                </div>

            </div>
            <div class="save-btn-wrapper">
                <button class="save-btn">
                    Save changes
                </button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
